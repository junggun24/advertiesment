name: Monthly SEO Link Audit

on:
  schedule:
    - cron: '0 1 1 * *' # 매월 1일 10:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/audit-production-links.mjs
