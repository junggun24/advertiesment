name: Backup Cloudflare Data

on:
  schedule:
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run backup:cloudflare
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo 'CLOUDFLARE_API_TOKEN secret is required before scheduled backups can run.'
